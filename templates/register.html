<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register • CyberSpace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#090a0f] text-white min-h-screen flex items-center justify-center p-6">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl w-full max-w-sm shadow-2xl">
        <h2 class="text-3xl font-extrabold text-center mb-8">สมัครสมาชิก</h2>
        <form action="/register" method="POST" class="space-y-4">
            <input type="text" name="username" placeholder="ตั้งชื่อผู้ใช้" required 
                   class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 focus:border-indigo-500 outline-none transition">
            <input type="password" name="password" placeholder="ตั้งรหัสผ่าน" required 
                   class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 focus:border-indigo-500 outline-none transition">
            <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 py-3 rounded-xl font-bold transition">สมัครสมาชิก</button>
        </form>
        <p class="text-center text-slate-400 text-sm mt-6">มีบัญชีแล้ว? <a href="/login" class="text-indigo-400 font-bold">เข้าสู่ระบบ</a></p>
    </div>
</body>
</html>
