<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สร้างโพสต์ใหม่ • CyberSpace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#090a0f] text-slate-100 min-h-screen flex items-center justify-center p-6 relative">
    <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-800/80 p-8 rounded-3xl w-full max-w-xl shadow-2xl relative z-10">
        <h2 class="text-2xl font-extrabold mb-6 text-center bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">✨ สร้างโพสต์ใหม่</h2>
        
        <form action="/add" method="POST" enctype="multipart/form-data" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">หัวข้อเรื่องราว</label>
                <input type="text" name="title" placeholder="ใส่หัวข้อที่น่าสนใจ..." required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500 text-white">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">อัปโหลดรูปภาพ หรือ วิดีโอ</label>
                <input type="file" name="media" accept="image/*,video/*" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">เนื้อหา</label>
                <textarea name="content" rows="4" placeholder="เขียนเล่าเรื่องราวของคุณตรงนี้..." required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500 text-white"></textarea>
            </div>
            <div class="flex justify-between items-center pt-2">
                <a href="/" class="text-slate-400 text-sm hover:text-white">← กลับหน้าหลัก</a>
                <button type="submit" class="bg-gradient-to-r from-indigo-500 to-cyan-400 text-black px-6 py-3 rounded-xl font-bold text-sm shadow-lg shadow-cyan-500/20 hover:opacity-90 transition">โพสต์ทันที</button>
            </div>
        </form>
    </div>
</body>
</html>
