<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เพิ่มโพสต์ใหม่ • CyberSpace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#090a0f] text-slate-100 min-h-screen flex items-center justify-center p-6 relative">
    
    <!-- Background Glow -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0 opacity-20">
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-indigo-600/40 rounded-full blur-[140px]"></div>
    </div>

    <div class="bg-slate-900/80 backdrop-blur-2xl border border-slate-800/80 p-8 rounded-3xl shadow-2xl w-full max-w-xl relative z-10">
        <div class="mb-6">
            <h2 class="text-2xl font-extrabold bg-gradient-to-r from-white via-indigo-200 to-cyan-400 bg-clip-text text-transparent">✨ สร้างเรื่องราวใหม่</h2>
            <p class="text-slate-400 text-xs mt-1">อัปโหลดภาพถ่ายหรือวิดีโอจากเครื่องของคุณเพื่อแชร์ความทรงจำ</p>
        </div>
        
        <form action="/add" method="POST" enctype="multipart/form-data" class="space-y-5">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">หัวข้อเรื่อง / ชื่อโพสต์</label>
                <input type="text" name="title" required placeholder="เช่น ทริปเดินทางสุดพิเศษ..." class="w-full bg-[#090a0f] border border-slate-800 rounded-2xl px-4 py-3.5 text-slate-100 text-sm focus:outline-none focus:border-cyan-500 transition">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">หมวดหมู่</label>
                    <select name="category" class="w-full bg-[#090a0f] border border-slate-800 rounded-2xl px-4 py-3.5 text-slate-100 text-sm focus:outline-none focus:border-cyan-500 transition">
                        <option value="ท่องเที่ยว">ท่องเที่ยว</option>
                        <option value="ไลฟ์สไตล์">ไลฟ์สไตล์</option>
                        <option value="ความทรงจำ">ความทรงจำ</option>
                        <option value="งานอดิเรก">งานอดิเรก</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">ไฟล์มีเดีย (ภาพ หรือ วิดีโอ)</label>
                    <input type="file" name="media" accept="image/*,video/*" class="w-full bg-[#090a0f] border border-slate-800 rounded-2xl px-3 py-2.5 text-slate-400 text-xs file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-cyan-500 file:text-black hover:file:bg-cyan-400 transition cursor-pointer">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">เนื้อหา / รายละเอียด</label>
                <textarea name="content" rows="4" required placeholder="เขียนเล่าเรื่องราวความรู้สึกของคุณ..." class="w-full bg-[#090a0f] border border-slate-800 rounded-2xl px-4 py-3.5 text-slate-100 text-sm focus:outline-none focus:border-cyan-500 transition resize-none"></textarea>
            </div>

            <div class="flex justify-between items-center pt-2">
                <a href="/" class="text-slate-400 hover:text-white text-sm font-semibold transition">← กลับหน้าหลัก</a>
                <button type="submit" class="bg-gradient-to-r from-indigo-500 to-cyan-400 text-black px-6 py-3.5 rounded-2xl font-extrabold text-sm transition shadow-lg shadow-cyan-500/20 hover:opacity-90">
                    เผยแพร่โพสต์
                </button>
            </div>
        </form>
    </div>

</body>
                        </html>
