<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เขียนเรื่องราวใหม่</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta+Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6">
    
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-max max-w-xl w-full">
        <div class="mb-6">
            <h2 class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">📝 เพิ่มเรื่องราวหรือภาพถ่ายใหม่</h2>
            <p class="text-slate-400 text-xs mt-1">อัปโหลดรูปภาพจากคลังของคุณและเขียนบรรยายความทรงจำ</p>
        </div>
        
        <form action="/add" method="POST" enctype="multipart/form-data" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">หัวข้อเรื่อง / ชื่อภาพ</label>
                <input type="text" name="title" required placeholder="เช่น ทริปเที่ยวทะเลวันหยุด..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 text-sm focus:outline-none focus:border-indigo-500 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">เลือกรูปภาพจากคลัง (ไฟล์ภาพ)</label>
                <input type="file" name="image" accept="image/*" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-400 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 transition cursor-pointer">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">เนื้อหา / รายละเอียด</label>
                <textarea name="content" rows="5" required placeholder="เล่าเรื่องราวหรือความรู้สึกในวันนี้..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 text-sm focus:outline-none focus:border-indigo-500 transition resize-none"></textarea>
            </div>

            <div class="flex justify-between items-center pt-2">
                <a href="/" class="text-slate-400 hover:text-white text-sm font-medium transition">← กลับหน้าหลัก</a>
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-xl font-semibold text-sm transition shadow-lg shadow-indigo-600/20">
                    เผยแพร่เรื่องราว
                </button>
            </div>
        </form>
    </div>

</body>
</html>
