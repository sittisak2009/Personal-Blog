<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เขียนเรื่องราวใหม่</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-center items-center justify-center py-12">
    
    <div class="bg-gray-800 p-8 rounded-xl shadow-xl border border-gray-700 w-full max-w-lg">
        <h2 class="text-2xl font-bold mb-6 text-center">📝 เพิ่มเรื่องราวหรือภาพถ่าย</h2>
        
        <form action="/add" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">หัวข้อเรื่อง / ชื่อภาพ</label>
                <input type="text" name="title" required class="w-full bg-gray-900 border border-gray-750 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">ลิงก์รูปภาพ (Image URL)</label>
                <input type="url" name="image" placeholder="https://..." class="w-full bg-gray-900 border border-gray-750 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">เนื้อหา / รายละเอียด</label>
                <textarea name="content" rows="4" required class="w-full bg-gray-900 border border-gray-750 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500"></textarea>
            </div>

            <div class="flex justify-between items-center pt-4">
                <a href="/" class="text-gray-400 hover:text-white text-sm">← กลับหน้าหลัก</a>
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2 rounded-lg font-medium transition shadow">
                    โพสต์เลย
                </button>
            </div>
        </form>
    </div>

</body>
</html>
