<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Blog & Gallery</title>
    <!-- ใช้ Tailwind CSS เพื่อความสวยงามแบบรวดเร็ว -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">
    
    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 py-6 shadow-md">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-3xl font-bold tracking-wider">🌟 My Personal Blog</h1>
            <p class="text-gray-400 mt-1">พื้นที่บันทึกเรื่องราว ไดอารี่ และแกลเลอรีภาพถ่าย</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="space-y-8">
            {% for post in posts %}
            <article class="bg-gray-800 rounded-xl overflow-hidden shadow-lg border border-gray-700 transition hover:border-gray-500">
                <img src="{{ post.image }}" alt="{{ post.title }}" class="w-full h-64 object-cover">
                <div class="p-6">
                    <span class="text-sm text-indigo-400 font-medium">{{ post.date }}</span>
                    <h2 class="text-2xl font-semibold mt-2 mb-3">{{ post.title }}</h2>
                    <p class="text-gray-300 leading-relaxed">{{ post.content }}</p>
                </div>
            </article>
            {% endfor %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-gray-500 text-sm border-t border-gray-800 mt-12">
        <p>Built with Python Flask & Render</p>
    </footer>

</body>
</html>
