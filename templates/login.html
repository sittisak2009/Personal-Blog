<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • CyberSpace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#090a0f] text-white min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
    
    <!-- Background Glow -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-cyan-600/20 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-800/80 p-8 rounded-3xl w-full max-w-sm shadow-2xl relative z-10">
        <div class="text-center mb-6">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-500 to-cyan-400 flex items-center justify-center font-black text-black text-xl mx-auto mb-3 shadow-lg shadow-cyan-500/20">CS</div>
            <h2 class="text-2xl font-extrabold text-white">ยินดีต้อนรับกลับมา</h2>
            <p class="text-slate-400 text-xs mt-1">เข้าสู่ระบบเพื่อแชร์เรื่องราวสุดล้ำของคุณ</p>
        </div>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-xl text-xs mb-4 text-center font-medium animate-pulse">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">ชื่อผู้ใช้</label>
                <input type="text" name="username" placeholder="กรอกชื่อผู้ใช้ของคุณ" required 
                       class="w-full bg-slate-950 border border-slate-800/80 rounded-xl px-4 py-3 text-sm focus:border-indigo-500 outline-none transition text-white">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">รหัสผ่าน</label>
                <input type="password" name="password" placeholder="••••••••" required 
                       class="w-full bg-slate-950 border border-slate-800/80 rounded-xl px-4 py-3 text-sm focus:border-indigo-500 outline-none transition text-white">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-indigo-500 hover:opacity-90 py-3 rounded-xl font-bold text-sm transition shadow-lg shadow-indigo-500/20 mt-2">เข้าสู่ระบบ</button>
        </form>

        <p class="text-center text-slate-400 text-xs mt-6">ยังไม่มีบัญชีใช่ไหม? <a href="/register" class="text-cyan-400 font-bold hover:underline">สมัครสมาชิกที่นี่</a></p>
    </div>
</body>
    </html>
